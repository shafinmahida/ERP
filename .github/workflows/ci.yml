name: Dayar-E-Habib ERP CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-test:
    name: TypeCheck & Suite Verification
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Execute Enterprise Scenario Validation Suite
        run: npx tsx scratch/test_20_enterprise_scenarios.ts
